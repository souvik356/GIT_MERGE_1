
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foodie - Delicious Food</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    background: #fffaf5;
    color: #292929;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 8%;
    background: white;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 10px #00000010;
}

.logo {
    font-size: 28px;
    font-weight: bold;
    color: #ff5722;
}

nav a {
    text-decoration: none;
    color: #333;
    margin-left: 25px;
    font-weight: 600;
}

nav a:hover {
    color: #ff5722;
}

.hero {
    min-height: 450px;
    padding: 80px 8%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 30px;
    background: #fff0e5;
}

.hero-content {
    max-width: 500px;
}

.hero h1 {
    font-size: 52px;
    line-height: 1.2;
    margin-bottom: 20px;
}

.hero h1 span {
    color: #ff5722;
}

.hero p {
    color: #666;
    font-size: 17px;
    margin-bottom: 25px;
}

.btn {
    background: #ff5722;
    color: white;
    padding: 13px 25px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
}

.btn:hover {
    background: #e64a19;
}

.hero img {
    width: 42%;
    max-width: 420px;
    border-radius: 50%;
}

section {
    padding: 65px 8%;
}

.section-title {
    text-align: center;
    font-size: 35px;
    margin-bottom: 35px;
}

.search-box {
    display: block;
    width: 100%;
    max-width: 450px;
    padding: 14px;
    margin: 0 auto 30px;
    border: 1px solid #ddd;
    border-radius: 30px;
    outline: none;
}

.categories {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 35px;
}

.category {
    padding: 10px 22px;
    border: 1px solid #ff5722;
    border-radius: 25px;
    background: white;
    cursor: pointer;
}

.category.active,
.category:hover {
    background: #ff5722;
    color: white;
}

.food-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 25px;
}

.food-card {
    background: white;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 5px 20px #00000010;
    transition: 0.3s;
}

.food-card:hover {
    transform: translateY(-7px);
}

.food-card img {
    width: 100%;
    height: 190px;
    object-fit: cover;
}

.food-info {
    padding: 20px;
}

.food-info h3 {
    margin-bottom: 8px;
}

.food-info p {
    color: #777;
    font-size: 14px;
    margin-bottom: 15px;
}

.price-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.price {
    color: #ff5722;
    font-weight: bold;
    font-size: 19px;
}

.add-btn {
    background: #ff5722;
    color: white;
    border: none;
    padding: 9px 15px;
    border-radius: 20px;
    cursor: pointer;
}

.cart {
    background: #fff0e5;
}

.cart-items {
    max-width: 650px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 0;
    border-bottom: 1px solid #eee;
    gap: 10px;
}

.quantity button {
    padding: 5px 10px;
    border: none;
    background: #ff5722;
    color: white;
    border-radius: 5px;
    cursor: pointer;
}

.total {
    text-align: right;
    font-size: 22px;
    font-weight: bold;
    margin-top: 25px;
}

footer {
    text-align: center;
    background: #222;
    color: white;
    padding: 25px;
}

@media(max-width: 700px) {
    header {
        flex-direction: column;
        gap: 15px;
    }

    nav a {
        margin: 0 8px;
    }

    .hero {
        flex-direction: column;
        text-align: center;
        padding: 55px 7%;
    }

    .hero h1 {
        font-size: 38px;
    }

    .hero img {
        width: 85%;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">🍔 Foodie</div>

    <nav>
        <a href="#home">Home</a>
        <a href="#menu">Menu</a>
        <a href="#cart">Cart 🛒</a>
    </nav>
</header>

<section class="hero" id="home">
    <div class="hero-content">
        <h1>Enjoy Your <span>Delicious Food</span></h1>
        <p>Fresh ingredients, amazing flavours and delicious meals delivered to your table.</p>
        <button class="btn" onclick="document.getElementById('menu').scrollIntoView({behavior:'smooth'})">
            Explore Menu
        </button>
    </div>

    <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=700" alt="Delicious pizza">
</section>

<section id="menu">
    <h2 class="section-title">Our Popular Menu 🍕</h2>

    <input
        type="text"
        class="search-box"
        id="search"
        placeholder="Search your favourite food..."
        oninput="displayFoods()"
    >

    <div class="categories">
        <button class="category active" onclick="filterFood('All',this)">All</button>
        <button class="category" onclick="filterFood('Pizza',this)">Pizza</button>
        <button class="category" onclick="filterFood('Burger',this)">Burger</button>
        <button class="category" onclick="filterFood('Drinks',this)">Drinks</button>
        <button class="category" onclick="filterFood('Dessert',this)">Dessert</button>
    </div>

    <div class="food-container" id="foodContainer"></div>
</section>

<section class="cart" id="cart">
    <h2 class="section-title">Your Shopping Cart 🛒</h2>

    <div class="cart-items">
        <div id="cartItems">Your cart is empty.</div>
        <div class="total" id="total">Total: ₹0</div>
        <br>
        <button class="btn" onclick="checkout()">Place Order</button>
    </div>
</section>

<footer>
    <p>© 2026 Foodie. Made with ❤️ for food lovers.</p>
</footer>

<script>

const foods = [
    {
        id: 1,
        name: "Cheese Pizza",
        category: "Pizza",
        price: 249,
        image: "https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500",
        description: "Delicious cheesy pizza."
    },
    {
        id: 2,
        name: "Classic Burger",
        category: "Burger",
        price: 149,
        image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500",
        description: "Fresh and juicy burger."
    },
    {
        id: 3,
        name: "Cold Coffee",
        category: "Drinks",
        price: 99,
        image: "https://images.unsplash.com/photo-1461023058943-07fcbe16d735?w=500",
        description: "Refreshing cold coffee."
    },
    {
        id: 4,
        name: "Chocolate Cake",
        category: "Dessert",
        price: 129,
        image: "https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=500",
        description: "Rich chocolate dessert."
    },
    {
        id: 5,
        name: "Pepperoni Pizza",
        category: "Pizza",
        price: 299,
        image: "https://images.unsplash.com/photo-1571407970349-bc81e7e96d47?w=500",
        description: "Tasty cheesy pizza."
    },
    {
        id: 6,
        name: "Chicken Burger",
        category: "Burger",
        price: 199,
        image: "https://images.unsplash.com/photo-1606755962773-d324e0a13086?w=500",
        description: "Crispy chicken burger."
    },
    {
        id: 7,
        name: "Fresh Juice",
        category: "Drinks",
        price: 79,
        image: "https://images.unsplash.com/photo-1600271886742-f049cd451bba?w=500",
        description: "Fresh fruit juice."
    },
    {
        id: 8,
        name: "Ice Cream",
        category: "Dessert",
        price: 89,
        image: "https://images.unsplash.com/photo-1563805042-7684c019e1cb?w=500",
        description: "Creamy delicious ice cream."
    }
];

let cart = [];
let selectedCategory = "All";

function displayFoods() {

    const container = document.getElementById("foodContainer");
    const search = document.getElementById("search").value.toLowerCase();

    const filtered = foods.filter(food => {
        const categoryMatch =
            selectedCategory === "All" ||
            food.category === selectedCategory;

        const searchMatch =
            food.name.toLowerCase().includes(search);

        return categoryMatch && searchMatch;
    });

    container.innerHTML = "";

    filtered.forEach(food => {

        container.innerHTML += `
            <div class="food-card">
                <img src="${food.image}" alt="${food.name}">
                <div class="food-info">
                    <h3>${food.name}</h3>
                    <p>${food.description}</p>

                    <div class="price-row">
                        <span class="price">₹${food.price}</span>
                        <button class="add-btn" onclick="addToCart(${food.id})">
                            Add +
                        </button>
                    </div>
                </div>
            </div>
        `;
    });

    if (filtered.length === 0) {
        container.innerHTML = "<p>No food found!</p>";
    }
}

function filterFood(category, button) {

    selectedCategory = category;

    document.querySelectorAll(".category").forEach(btn => {
        btn.classList.remove("active");
    });

    button.classList.add("active");

    displayFoods();
}

function addToCart(id) {

    const food = foods.find(item => item.id === id);

    const existing = cart.find(item => item.id === id);

    if (existing) {
        existing.quantity++;
    } else {
        cart.push({...food, quantity: 1});
    }

    updateCart();
}

function changeQuantity(id, amount) {

    const item = cart.find(item => item.id === id);

    if (!item) return;

    item.quantity += amount;

    if (item.quantity <= 0) {
        cart = cart.filter(item => item.id !== id);
    }

    updateCart();
}

function updateCart() {

    const container = document.getElementById("cartItems");
    const totalElement = document.getElementById("total");

    container.innerHTML = "";

    let total = 0;

    if (cart.length === 0) {
        container.innerHTML = "Your cart is empty.";
    }

    cart.forEach(item => {

        total += item.price * item.quantity;

        container.innerHTML += `
            <div class="cart-item">
                <div>
                    <strong>${item.name}</strong>
                    <br>
                    ₹${item.price} × ${item.quantity}
                </div>

                <div class="quantity">
                    <button onclick="changeQuantity(${item.id},-1)">−</button>
                    ${item.quantity}
                    <button onclick="changeQuantity(${item.id},1)">+</button>
                </div>
            </div>
        `;
    });

    totalElement.innerText = "Total: ₹" + total;
}

function checkout() {

    if (cart.length === 0) {
        alert("Please add some food to your cart!");
        return;
    }

    alert("Thank you! Your demo order has been placed.");

    cart = [];
    updateCart();
}

displayFoods();

</script>

</body>
</html>
